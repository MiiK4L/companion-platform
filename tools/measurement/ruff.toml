# Configuration de l'outil de lint/format du socle experimental.
# Choix d'outillage INTERNE (non structurant) : n'entre pas dans le modele de
# donnees ni dans l'architecture des campagnes.

line-length = 95
target-version = "py312"

[lint]
select = ["E", "F", "I", "W", "UP", "B"]
