site_name: Companion Platform
site_description: >-
  Plateforme électronique de poche open source, modulaire et évolutive,
  basée sur Seeed XIAO ESP32-S3.
site_url: https://miik4l.github.io/companion-platform/
repo_url: https://github.com/MiiK4L/companion-platform
repo_name: MiiK4L/companion-platform
edit_uri: edit/main/docs/

theme:
  name: material
  language: fr
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Basculer en mode sombre
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Basculer en mode clair
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - content.action.edit

plugins:
  - search

validation:
  nav:
    # Fichiers hors nav (ex. template d'ADR) : non bloquant en --strict.
    omitted_files: info
  links:
    # MkDocs ne voit que docs/ ; or la doc pointe légitimement vers des fichiers
    # du code source (firmware/, standards/, SECURITY.md…), non résolvables dans
    # le site. L'AUTORITÉ de vérification des liens est donc le contrôle DÉDIÉ
    # `tools/check_links.py` (workflow "Checks"), qui valide les liens relatifs
    # sur TOUT le dépôt (plus complet que MkDocs). MkDocs ne se prononce donc pas
    # sur l'existence des cibles (not_found: ignore) mais reste strict sur la
    # config, la nav et les ancres.
    not_found: ignore
    anchors: warn
    absolute_links: warn
    unrecognized_links: warn

