# Labels GitHub — Companion Platform
#
# Ce fichier définit l'ensemble des labels du dépôt, organisés par famille.
# Chaque famille utilise une teinte dédiée et cohérente, déclinée en plusieurs
# nuances pour distinguer ses membres :
#   - domain:*   (bleu)   — domaine technique concerné
#   - type:*     (violet) — nature du changement
#   - phase:*    (dégradé arc-en-ciel) — phase de la roadmap, du début (rouge)
#                 à la fin (magenta) du parcours prévu
#   - status:*   (ambre)  — état d'avancement
#   - priority:* (rouge)  — urgence/importance
#
# Ce fichier peut être appliqué avec un outil comme `github-label-sync` :
#   npx github-label-sync --access-token <token> --labels .github/labels.yml MiiK4L/companion-platform

# --- Domaine technique concerné (bleu) ---------------------------------
- name: "domain:firmware"
  color: "1B497E"
  description: "Concerne le firmware (HAL, drivers, kernel, Companion SDK, services)"
- name: "domain:hardware"
  color: "205897"
  description: "Concerne le matériel (cartes, schémas, PCB, boîtier)"
- name: "domain:os"
  color: "2566B1"
  description: "Concerne le système d'exploitation embarqué"
- name: "domain:cx-bus"
  color: "2B75CA"
  description: "Concerne le standard CX-Bus (Companion eXpansion Bus)"
- name: "domain:app"
  color: "3D85D6"
  description: "Concerne une application (ex. Tamagotchi) exécutée sur la plateforme"
- name: "domain:module"
  color: "5795DB"
  description: "Concerne un module d'extension CX-Bus"
- name: "domain:docs"
  color: "70A5E1"
  description: "Concerne la documentation du projet"
- name: "domain:ci"
  color: "89B5E6"
  description: "Concerne l'intégration/déploiement continu et l'infrastructure GitHub"

# --- Nature du changement (violet) --------------------------------------
- name: "type:feature"
  color: "51288A"
  description: "Nouvelle fonctionnalité ou amélioration"
- name: "type:bug"
  color: "6834B2"
  description: "Dysfonctionnement à corriger"
- name: "type:adr"
  color: "824DCB"
  description: "Proposition ou mise en œuvre d'une décision d'architecture (ADR)"
- name: "type:chore"
  color: "9E75D7"
  description: "Maintenance, outillage, dépendances, tâches diverses"
- name: "type:docs"
  color: "B99CE2"
  description: "Changement portant uniquement sur la documentation"

