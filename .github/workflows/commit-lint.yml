name: Commit Lint

# Vérifie que tous les commits d'une Pull Request respectent la convention
# Conventional Commits utilisée par le projet (feat/fix/docs/chore/refactor/
# test/ci/adr...).
#
# GitHub Actions épinglées au SHA (reproductible + sécurisé) ; le commentaire
# indique la version lisible. Montées de version gérées par Dependabot.

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

jobs:
  commitlint:
    name: Valider les messages de commit
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt (historique complet)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Installer Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"

      - name: Valider les commits avec commitlint
        uses: wagoid/commitlint-github-action@b948419dd99f3fd78a6548d48f94e3df7f6bf3ed # v6.2.1
        with:
          configFile: commitlint.config.mjs
