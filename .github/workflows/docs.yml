name: Documentation

# Construit systématiquement le site de documentation (push sur main et
# Pull Requests), et le déploie sur GitHub Pages uniquement lors d'un push
# sur main. Le déploiement ne s'exécute jamais sur une Pull Request.
#
# Les GitHub Actions sont épinglées à un SHA de commit (reproductible et
# sécurisé) ; le commentaire indique la version lisible correspondante.
# Les montées de version sont gérées par Dependabot (.github/dependabot.yml).

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: "docs-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build:
    name: Construire le site (mkdocs --strict)
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Installer Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Installer les dépendances de documentation (verrou épinglé)
        run: |
          python -m pip install --upgrade pip
          pip install -r docs/requirements.txt

      - name: Construire le site en mode strict
        run: mkdocs build --strict

      - name: Publier l'artefact du site
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    name: Déployer sur GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Déployer l'artefact
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
